substitutions:
  _REGION: us-central1
  _REPO: cloud-run-source-deploy
  _IMAGE: sales-intelligence-mcp
  _SERVICE: sales-intelligence-mcp

steps:
  # 1. Build the MCP server image, tagged with the commit SHA (traceable,
  #    reproducible) and also with :latest (convenience pointer only —
  #    never deploy off :latest in a real rollback scenario, deploy off
  #    the SHA tag so you know exactly what's running).
  #
  #    IMPORTANT: $SHORT_SHA is only populated when Cloud Build is triggered
  #    by a Cloud Build Trigger (e.g., GitHub trigger). For manual builds,
  #    use: gcloud builds submit --substitutions=SHORT_SHA=$(git rev-parse --short HEAD)
  #
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.mcp
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
      - .

  # 2. Push both tags to Artifact Registry.
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}

  # 3. Deploy to Cloud Run, pinned to the SHA tag (not :latest) so this
  #    build always deploys exactly what it just built and pushed — no
  #    race with a later build overwriting :latest before this step runs.
  #    NOTE: If $SHORT_SHA is empty (manual builds without trigger), this
  #    will fail. Use --substitutions=SHORT_SHA=$(git rev-parse --short HEAD)
  # Use the supported Cloud Build gcloud builder. The previous
  # gcr.io/google-cloud-sdk/slim image is no longer readable by this build
  # service account and caused the deploy step to fail after the image push.
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --allow-unauthenticated
      - --set-secrets=MCP_AUTH_TOKEN=mcp-auth-token:latest,GOOGLE_API_KEY=google-api-key:latest
      - --set-env-vars=ALLOWED_HOST=${_SERVICE}-$PROJECT_NUMBER.${_REGION}.run.app,MCP_TRANSPORT=streamable-http

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
