name: CI - Sales Intelligence Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (tools)
        run: python -m pytest tests/test_tools.py -v

      - name: Run unit tests (memory truncation)
        run: python -m pytest tests/test_memory_truncation.py -v

      - name: Run API integration tests
        env:
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
        run: python -m pytest tests/test_api.py -v

      - name: Run rate limit tests
        run: python -m pytest tests/test_rate_limit.py -v

  build:
    name: 🐳 Verify Docker images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI image
        run: docker build -t sales-agent:latest .

      - name: Build MCP image
        run: docker build -f Dockerfile.mcp -t sales-intelligence-mcp:latest .
